<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Clock Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <h1>Floating Clock</h1>
        </header>

        <main class="popup-content">
            <div class="setting-group">
                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="setting-text">Enable Clock</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="toggle-clock" checked>
                            <span class="toggle-slider"></span>
                        </div>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="setting-text">24-Hour Format</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="toggle-format">
                            <span class="toggle-slider"></span>
                        </div>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="setting-text">Focus Mode</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="toggle-focus">
                            <span class="toggle-slider"></span>
                        </div>
                    </label>
                    <p class="setting-description">Dark overlay for better concentration</p>
                </div>

                <div class="setting-item">
                    <label class="toggle-label">
                        <span class="setting-text">Lock Screen Mode</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="toggle-lockscreen">
                            <span class="toggle-slider"></span>
                        </div>
                    </label>
                    <p class="setting-description">Dim background with enhanced clock display</p>
                </div>
            </div>

            <div class="info-section">
                <div class="info-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Drag the clock to reposition</span>
                </div>
                <div class="info-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="9"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    <span>Auto-hides in fullscreen video</span>
                </div>
            </div>
        </main>

        <footer class="popup-footer">
            <div class="version-info">v1.0.0</div>
            <div class="footer-links">
                <button id="reset-settings" class="link-button">Reset Settings</button>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
